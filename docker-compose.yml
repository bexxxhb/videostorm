services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videostorm}
      POSTGRES_USER: ${POSTGRES_USER:-videostorm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videostorm}
    volumes:
      # Named volume: the catalogue survives `docker compose down` and container rebuilds.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videostorm} -d ${POSTGRES_DB:-videostorm}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "6432:5432"
    restart: unless-stopped

  app:
    build:
      context: .
    depends_on:
      db:
        # Flyway runs at startup, so the database must be accepting connections first.
        condition: service_healthy
    # Run as the host account that owns the media so the read-only mounts are readable.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-videostorm}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-videostorm}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-videostorm}
      # 'presentation' (view-only default: maintenance & login disabled and hidden) or 'maintenance'
      # (full behaviour). Switchable purely via .env - no image rebuild.
      APPLICATION_OPERATING_MODE: ${APPLICATION_OPERATING_MODE:-presentation}
      # Change these for anything beyond local use - the maintenance login is only as good as this password.
      VIDEOSTORM_ADMIN_USERNAME: ${VIDEOSTORM_ADMIN_USERNAME:-admin}
      VIDEOSTORM_ADMIN_PASSWORD: ${VIDEOSTORM_ADMIN_PASSWORD:-changeme}
      # Comma-separated source paths, inside the container. They must match the mounts below.
      VIDEOSTORM_SOURCES_MOVIES: ${VIDEOSTORM_SOURCES_MOVIES:-/media/movies-1,/media/movies-2,/media/movies-3,/media/movies-4,/media/movies-5}
      VIDEOSTORM_SOURCES_SHOWS: ${VIDEOSTORM_SOURCES_SHOWS:-/media/shows-1,/media/shows-2,/media/shows-3}
    volumes:
      # The library is bind-mounted read-only: the catalogue can never modify or delete it.
      #
      # Point these at the NAS MOUNT POINTS (host dirs that exist even when the share is offline),
      # not at paths inside the share. A mount point stays present-but-empty while its NAS is down,
      # so the bind source always exists and the container always starts; the app then aborts a
      # re-index instead of wiping the catalogue. 'propagation: rslave' surfaces the share inside
      # the container when the NAS (re)mounts on the host after the container has already started.
      # 'create_host_path: false' stops Compose fabricating an empty stub that would mask an
      # offline share.
      #
      # Up to 5 movie roots and 3 show roots, numbered 1..N. An unused slot defaults to an empty
      # local folder; VIDEOSTORM_SOURCES_MOVIES/SHOWS above can also be overridden to list fewer
      # container paths if some slots aren't in use.
      - qnapf18TB2160p:/media/movies-1
      - qnapf15TB2160p:/media/movies-2
      - qnapf15TB1080p:/media/movies-3
      - ts40012TB1080p:/media/movies-4
      - ts40012TB720p:/media/movies-5
      - ts40016TBShows:/media/shows-1
      - ts40014TBShows:/media/shows-2
      - ts40010TBShows:/media/shows-3

    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
  qnapf18TB2160p:
    driver_opts:
      type: cifs
      o: "user=marcelk,password=P_M2012!,file_mode=0777,dir_mode=0755,iocharset=utf8,vers=3.1.1,rw,uid=1000,gid=1000,sec=ntlmssp"
      device: "//192.168.10.244/hd_18tb_1/2160p"
  qnapf15TB2160p:
    driver_opts:
      type: cifs
      o: "user=marcelk,password=P_M2012!,file_mode=0777,dir_mode=0755,iocharset=utf8,vers=3.1.1,rw,uid=1000,gid=1000,sec=ntlmssp"
      device: "//192.168.10.244/hd_15tb_2/2160p"
  qnapf15TB1080p:
